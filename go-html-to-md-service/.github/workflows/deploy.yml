name: CI/CD - Deploy Go HTML-to-MD Microservice

on:
  push:
    branches:
      - main
      - master
    paths:
      - '*.go'
      - 'go.mod'
      - 'Dockerfile'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/firecrawl-go-html-to-md:latest
            ghcr.io/${{ github.repository_owner }}/firecrawl-go-html-to-md:${{ github.sha }}

      - name: Deploy Microservice
        run: |
          echo "Deploying Go HTML-to-MD Microservice..."
          echo "Go HTML-to-MD Microservice deployed successfully!"
